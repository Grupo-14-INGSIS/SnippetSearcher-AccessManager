version: '3.8'

services:
  snippetsearcher-accessmanager:
    image: ghcr.io/grupo-14-ingsis/snippetsearcher-accessmanager:${IMAGE_TAG:?falta IMAGE_TAG}
    environment:
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:?falta NEW_RELIC_APP_NAME}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY}

      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true -XX:TieredStopAtLevel=1
      DB_USER: access_manager
      DB_PASSWORD: access_manager
      DB_NAME: compose-db
      DB_HOST: accessmanager-db
      DB_PORT: 5432


    entrypoint:
      - bash
      - -c
      - |
        until bash -c "</dev/tcp/$$DB_HOST/$$DB_PORT" 2>/dev/null; do sleep 2; done
        sleep 5
        exec java -javaagent:/usr/local/newrelic/newrelic.jar -jar /app/app.jar


    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 900s

    networks: [default, snippetsearcher-net]
    deploy:
      replicas: 2
      restart_policy: { condition: any, delay: 10s }
      update_config: { parallelism: 1, delay: 10s, order: start-first, failure_action: rollback, monitor: 60s }

  accessmanager-db:
    image: postgres:16
    environment: { POSTGRES_USER: access_manager, POSTGRES_PASSWORD: access_manager, POSTGRES_DB: compose-db }
    volumes:
      - accessmanager-pgdata:/var/lib/postgresql/data
    configs:
      - { source: accessmanager_init_sql, target: /docker-entrypoint-initdb.d/01-init-access.sql }

networks:
  snippetsearcher-net: { external: true }

volumes:
  accessmanager-pgdata: { name: snippetsearcher_accessmanager-pgdata }

configs:
  accessmanager_init_sql: { name: accessmanager_init_v1, file: ./db/init/01-init-access.sql }