spring:
  application:
    name: snippet-searcher-accessmanager
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
server:
  port: 8080

# App consulta /actuator/health por la red interna para su propio chequeo de salud
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never